[project]
name = "lab_tools"
version = "0.1.0"
description = "A reproducible AI infrastructure workspace for AI 100, AMD ROCm 300 and PGX CUDA 700"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
"100" = "lab_tools.machines:main_100"
"300" = "lab_tools.machines:main_300"
"700" = "lab_tools.machines:main_700"
download = "lab_tools.media_download:main"
lab_tools = "lab_tools.cli:main"
init = "lab_tools.cli:init_main"
ds4 = "lab_tools.serve_ds4:main"
llama = "lab_tools.serve_llama:main"
sglang = "lab_tools.serve_sglang:main"
vllm = "lab_tools.serve_vllm:main"
freetoken = "lab_tools.serve_freetoken:main"

[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab_tools"]

[tool.setuptools.package-data]
lab_tools = ["media_models.json", "nltk_resources.json", "fixtures/*"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
