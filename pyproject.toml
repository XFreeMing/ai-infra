[project]
name = "ai-infra"
version = "0.1.0"
description = "A reproducible AI infrastructure research workspace for Mac study and PGX experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
init = "ai_infra.cli:init_main"
ds4 = "ai_infra.serve_ds4:main"
llama = "ai_infra.serve_llama:main"
sglang = "ai_infra.serve_sglang:main"
vllm = "ai_infra.serve_vllm:main"
freetoken = "ai_infra.serve_freetoken:main"

[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_infra"]
