[project]
name = "lab_tools"
version = "0.1.0"
description = "A reproducible AI infrastructure research workspace for Mac study and PGX experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lab_tools = "lab_tools.cli:main"
init = "lab_tools.cli:init_main"
ds4 = "lab_tools.serve_ds4:main"
llama = "lab_tools.serve_llama:main"
sglang = "lab_tools.serve_sglang:main"
vllm = "lab_tools.serve_vllm:main"
freetoken = "lab_tools.serve_freetoken:main"

[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab_tools"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
